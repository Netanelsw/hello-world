  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sidebar-w: 290px;
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --text: #f1f5f9; --muted: #94a3b8; --accent: #2563eb;
    }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #app { display: flex; height: 100vh; }
    #map { flex: 1; z-index: 0; }

    #sidebar {
      width: var(--sidebar-w); background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; overflow: hidden;
      z-index: 1000; box-shadow: 2px 0 12px rgba(0,0,0,.5);
    }
    #sidebar-header { padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
    #sidebar-header h1 { font-size: 15px; font-weight: 700; }
    #sidebar-header p  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* geocoding progress bar */
    #geo-bar {
      padding: 6px 16px; background: #172033; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 4px;
    }
    #geo-bar.done { display: none; }
    #geo-label { font-size: 10px; color: var(--muted); }
    #geo-track { height: 3px; background: var(--border); border-radius: 2px; }
    #geo-fill  { height: 3px; background: var(--accent); border-radius: 2px; width: 0%; transition: width .3s; }

    #search-box {
      margin: 10px 10px 0; padding: 8px 11px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-size: 13px;
      width: calc(100% - 20px); outline: none;
    }
    #search-box::placeholder { color: var(--muted); }
    #search-box:focus { border-color: var(--accent); }

    #filters { padding: 8px 10px 0; display: flex; flex-wrap: wrap; gap: 5px; }
    .filter-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 20px; border: 1.5px solid transparent;
      font-size: 10px; font-weight: 700; cursor: pointer;
      transition: opacity .15s, transform .1s; user-select: none;
    }
    .filter-btn.off { opacity: .3; }
    .filter-btn:active { transform: scale(.95); }

    #place-list { flex: 1; overflow-y: auto; padding: 6px 0; }
    #place-list::-webkit-scrollbar { width: 4px; }
    #place-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .place-item {
      display: flex; align-items: flex-start; gap: 9px;
      padding: 8px 13px; cursor: pointer; transition: background .12s;
      border-right: 3px solid transparent;
    }
    .place-item:hover { background: var(--surface); }
    .place-item.active { background: var(--surface); border-right-color: var(--accent); }
    .place-item.pending { opacity: .45; cursor: default; }
    .place-dot {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; border: 2px solid rgba(255,255,255,.15);
    }
    .place-name { font-size: 12px; font-weight: 600; line-height: 1.3; }
    .place-meta { font-size: 10px; color: var(--muted); margin-top: 1px; }

    #place-count { padding: 5px 13px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }

    #mobile-toggle {
      display: none; position: fixed; bottom: 16px; right: 16px; z-index: 2000;
      width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff;
      border: none; font-size: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.4);
      cursor: pointer; align-items: center; justify-content: center;
    }
    @media (max-width: 640px) {
      #app { flex-direction: column; }
      #map { height: 100vh; width: 100%; }
      #mobile-toggle { display: flex; }
      #sidebar {
        position: fixed; bottom: 0; left: 0; right: 0; width: 100%;
        max-height: 60vh; border-radius: 16px 16px 0 0;
        transform: translateY(100%); transition: transform .3s ease;
        z-index: 1500; box-shadow: 0 -4px 24px rgba(0,0,0,.5);
      }
      #sidebar.open { transform: translateY(0); }
      #sidebar-header { border-radius: 16px 16px 0 0; }
    }

    .leaflet-popup-content-wrapper { border-radius: 10px !important; box-shadow: 0 4px 20px rgba(0,0,0,.25) !important; padding: 0 !important; overflow: hidden; }
    .leaflet-popup-content { margin: 0 !important; width: auto !important; min-width: 210px; max-width: 260px; }
    .popup-inner { padding: 11px 13px; }
    .popup-cat { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; margin-bottom: 5px; color: #fff; }
    .popup-name { font-size: 14px; font-weight: 700; color: #111; line-height: 1.25; }
    .popup-genre { font-size: 11px; color: #555; margin-top: 2px; }
    .popup-addr { font-size: 11px; color: #444; margin-top: 4px; }
    .popup-note { font-size: 11px; color: #555; margin-top: 4px; font-style: italic; line-height: 1.4; }
    .popup-gmaps { display: block; margin-top: 7px; font-size: 11px; color: #2563eb; text-decoration: none; font-weight: 600; }
    .popup-gmaps:hover { text-decoration: underline; }
    .cm { border-radius: 50%; border: 2.5px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  </style>

// ── MAP ───────────────────────────────────────────────────────────────────────
const map = L.map('map', { center: [48.8700, 2.3300], zoom: 13, zoomControl: false });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 19
}).addTo(map);
L.control.zoom({ position: 'topright' }).addTo(map);

// ── ICONS & POPUPS ────────────────────────────────────────────────────────────
function makeIcon(cat, isHotel) {
  const c = CATS[cat] || CATS.poi;
  const size = isHotel ? 36 : 28, r = isHotel ? '8px' : '50%';
  return L.divIcon({ className: '',
    html: `<div class="cm" style="width:${size}px;height:${size}px;background:${c.color};border-radius:${r};">${c.icon}</div>`,
    iconSize: [size,size], iconAnchor: [size/2,size/2], popupAnchor: [0,-(size/2+4)] });
}

function makePopup(p) {
  const c = CATS[p.category] || CATS.poi;
  const q = encodeURIComponent(p.address || p.name);
  return `<div class="popup-inner">
    <span class="popup-cat" style="background:${c.color}">${c.icon} ${c.label}</span>
    <div class="popup-name">${p.name}</div>
    ${p.genre   ? `<div class="popup-genre">🍴 ${p.genre}</div>` : ''}
    ${p.address ? `<div class="popup-addr">📍 ${p.address.replace(', France','')}</div>` : ''}
    ${p.note    ? `<div class="popup-note">${p.note}</div>` : ''}
    <a class="popup-gmaps" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
  </div>`;
}

// ── CLUSTER & MARKERS ─────────────────────────────────────────────────────────
const cluster = L.markerClusterGroup({
  showCoverageOnHover: false, maxClusterRadius: 45,
  iconCreateFunction(g) {
    return L.divIcon({ html: `<div style="background:#2563eb;color:#fff;width:32px;height:32px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3);">${g.getChildCount()}</div>`, className:'', iconSize:[32,32] });
  }
});
cluster.addTo(map);

const markers = new Array(PLACES.length).fill(null);
const activeFilters = new Set(Object.keys(CATS));

function addMarkerForPlace(p, i) {
  if (!p.lat || !p.lng) return;
  const isHotel = p.category === 'hotel';
  const m = L.marker([p.lat, p.lng], { icon: makeIcon(p.category, isHotel) });
  m.bindPopup(makePopup(p), { maxWidth: 270 });
  markers[i] = m;
  if (isHotel) {
    m.addTo(map);
  } else if (activeFilters.has(p.category)) {
    cluster.addLayer(m);
  }
}

// Add hardcoded places immediately
PLACES.forEach((p, i) => { if (p.lat && p.lng) addMarkerForPlace(p, i); });

// ── FILTERS ───────────────────────────────────────────────────────────────────
const filtersEl = document.getElementById('filters');
Object.entries(CATS).forEach(([key, c]) => {
  if (!PLACES.some(p => p.category === key)) return;
  const btn = document.createElement('button');
  btn.className = 'filter-btn'; btn.dataset.cat = key;
  btn.style.cssText = `background:${c.bg};color:${c.text};border-color:${c.color}`;
  btn.innerHTML = `${c.icon} ${c.label}`;
  btn.addEventListener('click', () => {
    activeFilters.has(key) ? activeFilters.delete(key) : activeFilters.add(key);
    btn.classList.toggle('off', !activeFilters.has(key));
    refreshList(); refreshMarkers();
  });
  filtersEl.appendChild(btn);
});

// ── PLACE LIST ────────────────────────────────────────────────────────────────
const listEl   = document.getElementById('place-list');
const countEl  = document.getElementById('place-count');
const searchEl = document.getElementById('search-box');
let activeItem = null;

function refreshList() {
  const q = searchEl.value.toLowerCase();
  const visible = PLACES.map((p,i) => ({p,i})).filter(({p}) =>
    activeFilters.has(p.category) &&
    [p.name, p.genre||'', p.address||'', p.note||''].some(s => s.toLowerCase().includes(q))
  );
  listEl.innerHTML = '';
  const ready = markers.filter(Boolean).length;
  visible.forEach(({p,i}) => {
    const c = CATS[p.category] || CATS.poi;
    const loaded = !!markers[i];
    const el = document.createElement('div');
    el.className = 'place-item' + (loaded ? '' : ' pending');
    el.innerHTML = `
      <div class="place-dot" style="background:${c.color}">${c.icon}</div>
      <div>
        <div class="place-name">${p.name}</div>
        <div class="place-meta">${p.genre ? p.genre+' · ' : ''}${c.label}${p.address ? ' · '+p.address.split(',')[0] : ''}${loaded?'':' · pinning…'}</div>
      </div>`;
    if (loaded) {
      el.addEventListener('click', () => {
        map.flyTo([p.lat, p.lng], 17, { duration: 0.7 });
        markers[i].openPopup();
        if (activeItem) activeItem.classList.remove('active');
        el.classList.add('active'); activeItem = el;
        sidebar.classList.remove('open'); fab.textContent = '☰';
      });
    }
    listEl.appendChild(el);
  });
  countEl.textContent = `${visible.length} places · ${ready} pinned`;
}

function refreshMarkers() {
  cluster.clearLayers();
  PLACES.forEach((p,i) => {
    if (markers[i] && p.category !== 'hotel' && activeFilters.has(p.category)) cluster.addLayer(markers[i]);
  });
}

searchEl.addEventListener('input', refreshList);
refreshList();

// ── GEOCODING (runs in your browser, caches in localStorage) ──────────────────
const CACHE_KEY = 'paris-geocache-v3';
let geoCache = {};
try { geoCache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); } catch(e) {}

const geoBar   = document.getElementById('geo-bar');
const geoLabel = document.getElementById('geo-label');
const geoFill  = document.getElementById('geo-fill');
const total    = PLACES.length;

function updateGeoBar(done) {
  const pct = Math.round(done / total * 100);
  geoFill.style.width = pct + '%';
  const remaining = PLACES.slice(done).filter(p => !p.lat).length;
  if (remaining === 0) { geoBar.classList.add('done'); return; }
  geoLabel.textContent = `📍 Pinning places… ${done}/${total}`;
}

async function geocodeAll() {
  let done = 0;
  for (let i = 0; i < PLACES.length; i++) {
    const p = PLACES[i];
    if (!p.lat || !p.lng) {
      const cacheHit = geoCache[p.address];
      if (cacheHit) {
        p.lat = cacheHit[0]; p.lng = cacheHit[1];
        addMarkerForPlace(p, i);
      } else {
        try {
          const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(p.address)}&format=json&limit=1&countrycodes=fr,be`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data[0]) {
              p.lat = +data[0].lat; p.lng = +data[0].lon;
              geoCache[p.address] = [p.lat, p.lng];
              try { localStorage.setItem(CACHE_KEY, JSON.stringify(geoCache)); } catch(e) {}
              addMarkerForPlace(p, i);
            }
          }
        } catch(e) {}
        await new Promise(r => setTimeout(r, 1100));
      }
    }
    done++;
    updateGeoBar(done);
    refreshList();
  }
}

geocodeAll();
